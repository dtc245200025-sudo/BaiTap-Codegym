<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Box Model</title><style>*{box-sizing:border-box}body{font-family:Arial;background:#f5f7fb;margin:0;padding:40px}.box{width:420px;margin:30px auto;padding:32px;border:12px solid #2563eb;outline:10px solid #bfdbfe;background:#fff;color:#1e3a8a;box-shadow:0 12px 28px #0002}.box h1{margin-top:0}.note{border:2px dashed #f59e0b;padding:12px;background:#fffbeb}</style></head><body><main class="box"><h1>CSS Box Model</h1><p>Nội dung nằm trong content; khoảng trong là padding, đường viền là border và khoảng ngoài là margin.</p><div class="note">Content → Padding → Border → Margin</div></main></body></html>
