<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thực hành sử dụng CSS</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            max-width: 760px;
            margin: 48px auto;
            padding: 0 24px;
            background: #f4f7fb;
            color: #24324a;
        }

        h1 {
            color: #165dcc;
            font-family: Tahoma, sans-serif;
            font-size: 200%;
        }

        p {
            color: #c62828;
            font-family: Arial, sans-serif;
            font-size: 120%;
            line-height: 1.6;
            border: 1px solid #9ca3af;
            border-radius: 8px;
            padding: 10px;
            background: #ffffff;
        }

        #element1 {
            color: #165dcc;
            border-color: #165dcc;
            background: #eaf2ff;
        }
    </style>
</head>
<body>
    <h1>Đây là đề mục</h1>
    <p>Đây là đoạn văn bản thứ nhất.</p>
    <p>Đây là đoạn văn bản thứ hai.</p>
    <p>Đây là đoạn văn bản thứ ba.</p>
    <p id="element1">Đoạn văn bản có thuộc tính id và kiểu dáng riêng.</p>
</body>
</html>
