<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Đăng nhập</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><main class="container min-vh-100 d-flex align-items-center justify-content-center"><form class="card shadow p-4" style="max-width:420px;width:100%"><h1 class="h3 text-center mb-4">Đăng nhập</h1><div class="form-floating mb-3"><input type="email" class="form-control" id="email" placeholder="name@example.com" required><label for="email">Email</label></div><div class="form-floating mb-3"><input type="password" class="form-control" id="password" placeholder="Mật khẩu" required><label for="password">Mật khẩu</label></div><div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="remember"><label class="form-check-label" for="remember">Ghi nhớ đăng nhập</label></div><button class="btn btn-primary w-100" type="submit">Đăng nhập</button><p class="text-center mt-3 mb-0"><a href="#">Quên mật khẩu?</a></p></form></main></body></html>
