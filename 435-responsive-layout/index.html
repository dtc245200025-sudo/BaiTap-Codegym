<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Responsive Layout</title><style>*{box-sizing:border-box}body{margin:0;font:16px Arial}.header{background:#0f172a;color:white;padding:20px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:20px;padding:24px}.sidebar{grid-column:span 3;background:#e0f2fe;padding:20px}.content{grid-column:span 6}.ads{grid-column:span 3;background:#fef3c7;padding:20px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.card{border:1px solid #ddd;padding:18px;border-radius:8px}@media(max-width:900px){.sidebar{grid-column:span 4}.content{grid-column:span 8}.ads{display:none}}@media(max-width:600px){.sidebar,.content{grid-column:1/-1}.sidebar{order:2}.cards{grid-template-columns:1fr}}</style></head><body><header class="header"><h1>Responsive Web Design</h1></header><main class="grid"><aside class="sidebar">Menu<br>Trang chủ<br>Bài viết<br>Liên hệ</aside><section class="content"><h2>Nội dung tự thích ứng</h2><div class="cards"><article class="card">Cột thứ nhất</article><article class="card">Cột thứ hai</article></div></section><aside class="ads">Quảng cáo</aside></main></body></html>
